version: '3.8'

services:
  backend:
    build: ./backend
    container_name: mouseslip-backend
    restart: always
    environment:
      - STOCKFISH_PATH=/usr/games/stockfish
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    container_name: mouseslip-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
